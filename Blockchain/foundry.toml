# Foundry runs the fuzz / invariant suites in test/foundry (Hardhat runs the unit tests in test/).
# Same compiler settings as hardhat.config.js. Dependencies come from node_modules (npm ci).
[profile.default]
src = "contracts"
test = "test/foundry"
out = "forge-out"
cache_path = "forge-cache"
libs = ["node_modules"]
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "forge-std/=node_modules/forge-std/src/"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

# CI: `FOUNDRY_PROFILE=ci forge test`
[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 512
depth = 256
