name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mintgate
          POSTGRES_PASSWORD: mintgate
          POSTGRES_DB: mintgate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mintgate" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mintgate:mintgate@127.0.0.1:5432/mintgate_test
      REQUIRE_DB: "1" # database tests must run here, never skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deploy/requirements-deploy.txt
            requirements-dev.txt
      - name: Install (CPU PyTorch + pinned runtime deps)
        run: |
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r deploy/requirements-deploy.txt -r requirements-dev.txt
      - name: pytest (fast tests; slow ones need the real models)
        run: pytest -m "not slow"

  contracts:
    name: Contracts (Hardhat tests + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mintgate
          POSTGRES_PASSWORD: mintgate
          POSTGRES_DB: mintgate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mintgate" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mintgate:mintgate@127.0.0.1:5432/mintgate_test
      REQUIRE_DB: "1" # database tests must run here, never skip
    defaults:
      run:
        working-directory: Blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Blockchain/package-lock.json
      - run: npm ci
      - run: npx hardhat test
      - name: Coverage (fails below 95 % lines / branches)
        run: npm run coverage
      - uses: actions/upload-artifact@v4
        with:
          name: contract-coverage
          path: Blockchain/coverage/
      # The Python EIP-712 signer against the real contract on a local Hardhat node.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npx hardhat compile --force # coverage leaves instrumented artifacts behind
      - name: EIP-712 signer + chain indexer + chain worker on a Hardhat node (pytest -m chain)
        working-directory: .
        run: |
          pip install web3==8.0.0 numpy==2.5.3 Pillow==12.3.0 SQLAlchemy==2.1.6 alembic==1.20.1             "psycopg[binary]==3.3.6" pgvector==0.5.1 redis==8.1.0 rq==3.0.0 -r requirements-dev.txt
          pytest backend/tests/test_eip712.py backend/tests/test_indexer.py

  foundry:
    name: Foundry fuzz + invariant tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Blockchain/package-lock.json
      - run: npm ci # OpenZeppelin + forge-std come from node_modules
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - name: "forge test (ci profile: 5000 fuzz runs, 512 x 256 invariant calls)"
        run: forge test
        env:
          FOUNDRY_PROFILE: ci

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Blockchain/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: Blockchain
      - run: pip install slither-analyzer==0.11.6
      # Our own code only (OpenZeppelin findings are excluded); low / informational findings
      # are reported but accepted with a justification in docs/security.md.
      - name: slither
        working-directory: Blockchain
        run: slither . --fail-medium

  e2e:
    name: Browser E2E (Playwright + Hardhat)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mintgate
          POSTGRES_PASSWORD: mintgate
          POSTGRES_DB: mintgate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mintgate" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # node --test with a glob
          cache: npm
          cache-dependency-path: |
            Blockchain/package-lock.json
            e2e/package-lock.json
      - name: Frontend unit tests (report hash parity with Python)
        run: node --test "frontend/tests/*.test.mjs"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deploy/requirements-deploy.txt
            requirements-dev.txt
      - name: "Install Python stack (CPU PyTorch: the fake models still import the pipeline)"
        run: |
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r deploy/requirements-deploy.txt -r requirements-dev.txt
      - run: npm ci && npx hardhat compile
        working-directory: Blockchain
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Playwright (SIWE, signed upload, artist-paid mint, provenance page)
        working-directory: e2e
        run: npx playwright test
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/

  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Blockchain/package-lock.json
      - run: npm ci
        working-directory: Blockchain
      - uses: pre-commit/action@v3.0.1
